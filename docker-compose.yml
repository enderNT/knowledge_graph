services:
  api:
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      arcadedb:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  arcadedb:
    image: arcadedata/arcadedb:26.5.1
    env_file:
      - ${ENV_FILE:-.env}
    command: >-
      /bin/sh -lc 'export JAVA_OPTS="$${JAVA_OPTS} -Darcadedb.server.rootPassword=$${ARCADEDB_ROOT_PASSWORD}";
      exec ./bin/server.sh'
    expose:
      - "2480"
    restart: unless-stopped
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-lc",
          "wget -q -O - http://127.0.0.1:2480/api/v1/ready >/dev/null",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  arcadedb_data:
