services:
  api:
    build:
      context: .
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      arcadedb:
        condition: service_healthy
      anthropic-gateway:
        condition: service_healthy
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  anthropic-gateway:
    build:
      context: ./anthropic-gateway
    env_file:
      - ${ENV_FILE:-.env}
    expose:
      - "8081"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "-",
          "http://127.0.0.1:8081/health/ready",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  mcp:
    build:
      context: .
    command: ["uvicorn", "app.mcp_server:app", "--host", "0.0.0.0", "--port", "9000"]
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "9000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health/ready')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  agent-mcp:
    build:
      context: .
    command: ["uvicorn", "app.agent_mcp_server:app", "--host", "0.0.0.0", "--port", "9100"]
    env_file:
      - ${ENV_FILE:-.env}
    depends_on:
      mcp:
        condition: service_healthy
    ports:
      - "${AGENT_MCP_PORT:-9100}:9100"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9100/health/ready')",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  observability-ui:
    build:
      context: ./observability-ui
    environment:
      - API_BASE=http://api:8000
      - API_KEY=${API_KEY:-change-me}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OBS_UI_PORT:-3000}:3000"
    restart: unless-stopped

  arcadedb:
    image: arcadedata/arcadedb:26.5.1
    env_file:
      - ${ENV_FILE:-.env}
    command: >-
      /bin/sh -lc 'export JAVA_OPTS="$${JAVA_OPTS} -Darcadedb.server.rootPassword=$${ARCADEDB_ROOT_PASSWORD}";
      exec ./bin/server.sh'
    expose:
      - "2480"
    restart: unless-stopped
    volumes:
      - arcadedb_data:/home/arcadedb/databases
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-lc",
          "wget -q -O - http://127.0.0.1:2480/api/v1/ready >/dev/null",
        ]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  arcadedb_data:
